# CI — auth deep link validation and Firestore security rules tests.
# No secrets required. Runs on push/PR to main.

name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-links:
    name: Auth deep link tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run auth link tests
        run: npm run test:auth-links

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore rules tests
        run: npm run test:firestore-rules

  secret-scan:
    name: Firebase native config guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run secret scan
        run: npm run verify:no-firebase-secrets

  map-bleed-and-visual-qa:
    name: Map bleed + visual QA sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify no ArchetypeResultMap imports outside allowlist
        run: npm run verify:no-map-in-switcher

      - name: Verify visual QA sign-off when archetype map changes
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: |
          git fetch origin "${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}" --depth=1 || true
          npm run verify:visual-qa-signoff
